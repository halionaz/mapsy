packages:
  # Glob rather than a literal, so mapsy-server / mapsy-native join the
  # workspace by existing instead of by remembering to edit this file.
  - 'mapsy-*'
  - 'packages/*'

# pnpm 10 blocks postinstall scripts by default. These need theirs to fetch/build
# native binaries, so they have to be allowed explicitly.
onlyBuiltDependencies:
  - esbuild
