packages:
  # Glob rather than a literal, so mapsy-server / mapsy-native join the
  # workspace by existing instead of by remembering to edit this file.
  - 'mapsy-*'
  - 'packages/*'

# pnpm 10 blocks postinstall scripts by default and warns about each one it
# skipped. Both packages below only use theirs to swap a JS shim for the native
# binary that their platform optionalDependency already installed — neither is
# required. The lists just record the decision and silence the warnings.
onlyBuiltDependencies:
  - esbuild

ignoredBuiltDependencies:
  - workerd
